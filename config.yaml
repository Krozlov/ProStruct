# ProStruct Configuration File
# Version: 1.0.0

data:
  num_real_proteins: 19  # From Biopython test corpus
  num_synthetic_mutants: 481  # To reach ~500 total
  train_split: 0.7
  val_split: 0.15
  test_split: 0.15
  random_seed: 42

model:
  embedding_dim: 64
  num_heads: 4
  num_layers: 4
  hidden_dim: 256
  dropout: 0.1
  max_seq_len: 1024
  vocab_size: 23  # 20 amino acids + padding + mask + unknown

training:
  batch_size: 32
  learning_rate: 0.001
  epochs_pretrain: 10
  epochs_finetune: 20
  mask_prob: 0.15
  warmup_steps: 1000

queue:
  redis_host: localhost
  redis_port: 6379
  redis_db: 0
  max_retries: 3
  retry_backoff_base: 2
  heartbeat_interval: 30
  task_timeout: 300

workers:
  num_workers: 4
  worker_timeout: 60

dashboard:
  host: 0.0.0.0
  port: 8000
